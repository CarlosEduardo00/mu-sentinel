# Roda os testes automáticos a cada envio para a main (e em pull requests).
# O MU Sentinel é só para Windows: mesmo Python e mesmos pacotes do build.ps1.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen  # testes da tela sem abrir janela
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # Igual ao build.ps1: o RapidOCR puxa o opencv-python completo; o app usa só o headless
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install opencv-python-headless

      - name: Testes
        run: python -m pytest -q
